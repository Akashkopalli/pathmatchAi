    <circle cx="12" cy="35" r="2.8" fill="#0284c7"/>
    <circle cx="25" cy="26" r="2.4" fill="#2563eb"/>
    <circle cx="35" cy="14" r="2" fill="#7c3aed"/>
    <path d="M35 30L36 33L39 34L36 35L35 38L34 35L31 34L34 33Z" 

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Compass / Path Matching Geometry -->
  <g filter="url(#subtleShadow)">
    <!-- Lower foundation curve (Student profile & foundational skills) -->
    <path d="M16 46C16 38 22 34 30 34H36C42 34 46 30 46 22" 
          stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Ascending career trajectory branch (Occupational alignment) -->
    <path d="M26 46C26 38 32 30 42 22L46 18" 
          stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Arrow head pointing north-east (Career advancement) -->
    <path d="M38 18H46V26" 
          stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Nodes / Matching verification points -->
    <circle cx="16" cy="46" r="3.5" fill="#38bdf8"/>
    <circle cx="33" cy="34" r="3" fill="#60a5fa"/>
    <circle cx="46" cy="18" r="2.5" fill="#c084fc"/>

    <!-- AI Sparkle / Innovation star -->
    <path d="M46 38L47.5 42L51.5 43.5L47.5 45L46 49L44.5 45L40.5 43.5L44.5 42Z" 
          fill="#38bdf8" opacity="0.9"/>
  </g>
</svg>
